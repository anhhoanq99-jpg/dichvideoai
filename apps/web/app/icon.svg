<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <!--
    Favicon = BrandMark trong components/brand-logo.tsx, vẽ lại y hệt nhưng thay
    var(--color-primary-500)/var(--color-accent-600) bằng hex thật: file này nằm
    ngoài trang nên không có biến CSS nào để tra.
    Sửa logo ở brand-logo.tsx thì SỬA CẢ ĐÂY (và chạy lại apps/web/scripts/gen-icons.mts).
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee5631"/>
      <stop offset="1" stop-color="#7c3add"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="38" height="38" rx="11" fill="url(#g)"/>
  <!-- nút play — video -->
  <path d="M13.5 10.5v13l11-6.5z" fill="#fff"/>
  <!-- sóng âm — lồng tiếng -->
  <path d="M28 13a7.5 7.5 0 0 1 0 8" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.9"/>
  <path d="M31.5 10.5a12 12 0 0 1 0 13" stroke="#fff" stroke-width="2.2" stroke-linecap="round" fill="none" opacity="0.5"/>
  <!-- vạch phụ đề — sub -->
  <rect x="9" y="28.5" width="15" height="3.4" rx="1.7" fill="#fff" opacity="0.95"/>
  <rect x="26" y="28.5" width="5.5" height="3.4" rx="1.7" fill="#fff" opacity="0.5"/>
</svg>
